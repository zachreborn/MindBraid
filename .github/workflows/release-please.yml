name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release pull request and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Pull requests, tags, and releases created with the default GITHUB_TOKEN
      # do not start other workflows; workflow_dispatch is the documented
      # exception. Dispatch CI on the release branch so its check runs attach to
      # the release pull request head commit.
      - name: Run CI on the release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"

      # The tag created for a merged release pull request will not trigger
      # release.yml either, so dispatch it on the new tag. release.yml uploads
      # the verified, attested assets to the draft release created above. If a
      # personal access token or app token is ever passed to Release Please,
      # the tag push starts release.yml itself and this step can be removed.
      - name: Build and attest release assets
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG"
